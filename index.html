<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/icon-512.png" />
    <link rel="apple-touch-icon" href="/assets/icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Free exam prep for SSC CGL, SSC MTS, SSC CHSL, IBPS PO, IBPS Clerk, SBI PO and SBI Clerk, with an offline-capable Android app. Study, practice, and take mock tests right in your browser." />
    <title>Pariksha Saathi — SSC, IBPS &amp; SBI Exam Prep</title>
    <!-- shared-head: everything between these two markers is copied verbatim into every
         prerendered page's <head> by scripts/prerender.mjs (readBuiltAssets), so this block is the
         single source of truth for fonts and PWA metadata. Keep it self-contained. -->
    <!-- shared-head -->
    <meta name="theme-color" content="#1e3a52" />
    <!-- Fonts are self-hosted (public/fonts/, Google's own latin/latin-ext/devanagari woff2
         subsets, versioned in the file name so _headers can mark them immutable) and declared
         inline here instead of via a render-blocking Google Fonts stylesheet: that stylesheet
         alone cost a DNS+TLS+request round trip on the critical path before any text could paint
         (FCP 3.5 s on slow 4G). Only the files a page's text actually needs are
         fetched, thanks to unicode-range: an English page never downloads the Devanagari subset.
         The two latin files below are preloaded because the hero <h1> (the LCP element) and body
         copy use them on every page; everything else is discovered through the CSS. -->
    <link rel="preload" href="/fonts/fraunces-latin-v38.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ibm-plex-sans-latin-v23.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face{font-family:'Fraunces';font-style:normal;font-weight:500 700;font-display:swap;src:url(/fonts/fraunces-latin-v38.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
      @font-face{font-family:'Fraunces';font-style:normal;font-weight:500 700;font-display:swap;src:url(/fonts/fraunces-latin-ext-v38.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20B8,U+20BA-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
      @font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:400 700;font-display:swap;src:url(/fonts/ibm-plex-sans-latin-v23.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
      @font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:400 700;font-display:swap;src:url(/fonts/ibm-plex-sans-latin-ext-v23.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20B8,U+20BA-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
      @font-face{font-family:'IBM Plex Sans Devanagari';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/ibm-plex-sans-devanagari-400-v12.woff2) format('woff2');unicode-range:U+0900-097F,U+1CD0-1CF4,U+1CF7-1CF9,U+200C-200D,U+20A8,U+20F0,U+25CC,U+A830-A839,U+A8E0-A8FF,U+11B00-11B0A}
      @font-face{font-family:'IBM Plex Sans Devanagari';font-style:normal;font-weight:600;font-display:swap;src:url(/fonts/ibm-plex-sans-devanagari-600-v12.woff2) format('woff2');unicode-range:U+0900-097F,U+1CD0-1CF4,U+1CF7-1CF9,U+200C-200D,U+20A8,U+20F0,U+25CC,U+A830-A839,U+A8E0-A8FF,U+11B00-11B0A}
      /* Metric-matched fallbacks: while a web font is still downloading, text is drawn in the
         system font these rules size so that it occupies the same width and line height as the
         real font will. The swap then changes letterforms but not layout - no shift, and the hero
         <h1> is not re-reported as a bigger (later) largest-contentful-paint candidate. Georgia /
         Arial cover iOS, macOS and Windows; Noto Serif / Roboto cover Android. A missing local()
         font just makes that family unusable, so the stack in theme.css falls through to the
         next one. Values from fontTools (avg. English character width, hhea metrics), see the
         website repo's commit that introduced them. */
      @font-face{font-family:'Fraunces Fallback Georgia';font-weight:500 700;src:local('Georgia Bold'),local('Georgia-Bold');size-adjust:91.58%;ascent-override:106.79%;descent-override:27.84%;line-gap-override:0%}
      @font-face{font-family:'Fraunces Fallback Noto';font-weight:500 700;src:local('Noto Serif Bold'),local('NotoSerif-Bold');size-adjust:92.28%;ascent-override:105.99%;descent-override:27.63%;line-gap-override:0%}
      @font-face{font-family:'IBM Plex Sans Fallback Arial';font-weight:100 500;src:local('Arial'),local('ArialMT');size-adjust:101.57%;ascent-override:100.92%;descent-override:27.07%;line-gap-override:0%}
      @font-face{font-family:'IBM Plex Sans Fallback Arial';font-weight:600 900;src:local('Arial Bold'),local('Arial-BoldMT');size-adjust:97.14%;ascent-override:105.52%;descent-override:28.31%;line-gap-override:0%}
      @font-face{font-family:'IBM Plex Sans Fallback Roboto';font-weight:100 500;src:local('Roboto'),local('Roboto-Regular');size-adjust:101.03%;ascent-override:101.45%;descent-override:27.22%;line-gap-override:0%}
      @font-face{font-family:'IBM Plex Sans Fallback Roboto';font-weight:600 900;src:local('Roboto Bold'),local('Roboto-Bold');size-adjust:103.24%;ascent-override:99.29%;descent-override:26.64%;line-gap-override:0%}
    </style>
    <!-- /shared-head -->
